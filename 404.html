<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Страница не найдена — цифровой сад заблудился">
  <meta name="robots" content="noindex">
  <title>404 — Страница не найдена | Digital Garden</title>
  
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">

  <style>
    html {
      --bg-primary: #FAFAFA;
      --text-primary: #111827;
    }
    
    html.dark {
      --bg-primary: #111827;
      --text-primary: #F3F4F6;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .error-container {
      text-align: center;
      max-width: 600px;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #2563EB 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 1rem 0;
      line-height: 1;
    }

    .error-title {
      font-size: 2rem;
      font-family: 'Lora', serif;
      font-weight: 700;
      margin: 1rem 0;
    }

    .error-description {
      font-size: 1.125rem;
      color: var(--text-secondary);
      margin: 1.5rem 0 2rem 0;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .btn-error {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: transparent;
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-error:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background-color: #1e40af;
      border-color: #1e40af;
      color: white;
    }

    .error-emoji {
      font-size: 4rem;
      margin: 1rem 0;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    footer {
      margin-top: auto;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <nav style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%;">
      <a href="index.html" style="text-decoration: none; font-weight: 700; font-size: 1.125rem; color: var(--text-primary);">🌱 Цифровой сад</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" style="background: transparent; border: none; cursor: pointer; font-size: 1.5rem;">🌙</button>
    </nav>
  </header>

  <!-- Main Error Content -->
  <main>
    <div class="error-container">
      <div class="error-emoji">🌱</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Страница не найдена</h1>
      <p class="error-description">
        К сожалению, сад не смог найти то, что вы ищете. 
        Может быть, страница была перемещена или удалена?
      </p>
      
      <div class="error-actions">
        <a href="index.html" class="btn-error btn-primary">
          ← Вернуться на главную
        </a>
        <button onclick="history.back()" class="btn-error">
          Вернуться назад
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div style="text-align: center; padding: 2rem 1rem; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 0.9rem;">
      <p>© 2026 Цифровой сад. Все права защищены.</p>
    </div>
  </footer>

  <!-- Theme toggle script -->
  <script>
    (function() {
      const html = document.documentElement;
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      
      if (theme === 'dark') {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
    })();

    document.getElementById('themeToggle').addEventListener('click', function() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      this.textContent = isDark ? '☀️' : '🌙';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Digital Garden 2026 — Современный архив исследований о технологиях, дизайне, философии и жизни.">
  <meta name="theme-color" content="#2563EB">
  
  <!-- Manifest for PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Digital Garden">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Digital Garden — 2026">
  <meta property="og:description" content="Современный архив исследований и размышлений">
  <meta property="og:type" content="website">

  <title>Digital Garden 2026 — Исследования и размышления</title>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Inline critical styles for faster FCP */
    html {
      --bg-primary: #FAFAFA;
      --text-primary: #111827;
    }
    
    html.dark {
      --bg-primary: #111827;
      --text-primary: #F3F4F6;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <nav>
      <div class="logo" data-i18n="logo">🌱 Цифровой сад</div>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <button id="languageToggle" class="language-toggle" style="background: transparent; border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text-primary); transition: all 0.2s;" aria-label="Switch language">EN</button>
      </div>
    </nav>
  </header>

  <!-- Banner illustration -->
  <img src="images/fonart.jpg" alt="Уютный цифровой сад — рабочие столы, книги и кот" class="site-banner">

  <!-- Main Content -->
  <main>
    <!-- Hero Section -->
    <section class="hero">
      <div class="container">
        <h1 data-i18n="logo">🌱 Цифровой сад</h1>
        <p style="font-size: 1.125rem; color: var(--text-secondary); margin-bottom: 2rem;" data-i18n="tagline">
          От технологий и дизайна до философии и личных размышлений
        </p>
      </div>
    </section>

    <!-- Search Section -->
    <section class="search-section">
      <div class="container-wide">
        <div class="search-container">
          <input 
            type="search" 
            id="searchInput" 
            class="search-input" 
            data-i18n-placeholder="search_placeholder"
            placeholder="Поиск статей (Ctrl+K)..."
            aria-label="Search articles"
          >
          <button id="searchClear" class="btn-search-clear" style="display: none;" aria-label="Clear search">Очистить</button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
          <div class="filter-container" id="filterContainer">
            <span class="filter-label" data-i18n="filter_label">Фильтр по категориям:</span>
            <!-- Filters will be generated by JavaScript -->
          </div>
        </div>

        <!-- Results Info -->
        <div class="results-info">
          <span id="resultsCount" data-i18n="results_count">Найдено статей:</span>
        </div>
      </div>
    </section>

    <!-- Articles Grid -->
    <section class="articles-section">
      <div class="container-wide">
        <div class="articles-grid" id="articlesGrid">
          <!-- Articles will be generated by JavaScript -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" style="display: none; text-align: center; padding: 3rem 1rem;">
          <p style="font-size: 1.125rem; color: var(--text-secondary);" data-i18n="no_results">
            Статей не найдено. Попробуй изменить поиск или фильтры.
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-links">
        <button id="contactFormBtn" class="footer-link-btn" title="Связаться" aria-label="Open contact form">
          📧 Связаться
        </button>
        <a href="https://github.com/228burger228" target="_blank" rel="noopener noreferrer" title="GitHub">
          💼 GitHub
        </a>
        <a href="https://t.me/aimovl" target="_blank" rel="noopener noreferrer" title="Telegram">
          ✈️ Telegram
        </a>
      </div>
      <p class="footer-copyright" data-i18n="footer_copyright">© 2026 Цифровой сад. Все права защищены.</p>
    </div>
  </footer>

  <!-- Contact Form Modal -->
  <div id="contactModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
      <button class="modal-close" aria-label="Close modal">&times;</button>
      <h2 style="margin-top: 0;">Напишите мне</h2>
      
      <form id="contactForm" class="contact-form">
        <div class="form-group">
          <label for="name">Имя</label>
          <input type="text" id="name" name="name" required placeholder="Ваше имя">
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="Ваш email">
        </div>
        
        <div class="form-group">
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" required placeholder="Ваше сообщение" rows="5"></textarea>
        </div>
        
        <div id="formStatus" style="display: none; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; text-align: center;"></div>
        
        <button type="submit" class="btn-submit" id="submitBtn">Отправить</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // CRITICAL: Initialize theme BEFORE rendering
    (function() {
      const html = document.documentElement;
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      
      console.log('[Theme] Initializing with:', theme, '(saved:', savedTheme, ', prefers-dark:', prefersDark + ')');
      
      if (theme === 'dark') {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
    })();
  </script>

  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/contact-form.js" defer></script>
  <script src="js/seo.js" defer></script>
  <script>window.SITE_ROOT = '';</script>
  <script src="js/floating-nav.js" defer></script>
  
  <script>
    // Language toggle + Theme toggle initialization
    document.addEventListener('DOMContentLoaded', () => {
      const themeToggle = document.getElementById('themeToggle');
      const languageToggle = document.getElementById('languageToggle');
      const html = document.documentElement;
      
      // Initialize theme toggle
      const updateThemeButton = () => {
        const isDark = html.classList.contains('dark');
        themeToggle.textContent = isDark ? '☀️' : '🌙';
      };
      
      updateThemeButton();
      
      themeToggle.addEventListener('click', () => {
        console.log('[Theme] Toggle clicked');
        html.classList.toggle('dark');
        const isDark = html.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeButton();
        console.log('[Theme] Changed to:', isDark ? 'dark' : 'light');
      });
      
      // Initialize language toggle
      const currentLang = localStorage.getItem('language') || 'ru';
      languageToggle.textContent = currentLang === 'ru' ? 'EN' : 'RU';
      
      languageToggle.addEventListener('click', () => {
        const newLang = currentLang === 'ru' ? 'en' : 'ru';
        localStorage.setItem('language', newLang);
        location.reload();
      });
    });
  </script>
</body>
</html>
